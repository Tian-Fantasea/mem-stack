services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    command: etcd --data-dir=/etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380 --auto-compaction-mode=revision --auto-compaction-retention=1000 --quota-backend-bytes=4294967296
    volumes: [ etcd-data:/etcd ]
  s3:
    image: openeuler/seaweedfs:4.03-oe2403sp2
    command: server -s3 -ip=0.0.0.0
    ports: [ "127.0.0.1:8333:8333" ]
    volumes: [ s3-data:/data ]
  milvus:
    restart: unless-stopped
    image: openeuler/milvus:2.6.0-oe2403sp2
    command: milvus run standalone
    ports: [ "127.0.0.1:19530:19530", "127.0.0.1:9091:9091" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: s3:8333
      MINIO_USESSL: "false"
      MINIO_USEPATHSTYLE: "true"
      MINIO_ACCESSKEYID: anykey
      MINIO_SECRETACCESSKEY: anysecret
      MINIO_BUCKETNAME: milvus
    depends_on: [ etcd, s3 ]
    volumes: [ milvus-data:/var/lib/milvus ]
  embed:
    build: ./embed
    ports: [ "127.0.0.1:8090:80" ]
    volumes: [ ./embed/models/bge-m3:/data ]
  mem0:
    restart: unless-stopped
    build: ./mem0
    ports: [ "127.0.0.1:8888:8888" ]
    env_file: .env
    environment:
      MEM0_VECTOR_URL: http://milvus:19530
      MEM0_LLM_BASE: http://172.17.0.1:8000/v1
      MEM0_LLM_MODEL: qwen
      MEM0_EMB_BASE: http://embed:80/v1
      MEM0_EMB_MODEL: bge-m3
    depends_on: [ milvus, embed ]
volumes: { etcd-data: {}, s3-data: {}, milvus-data: {} }
